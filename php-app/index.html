<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lab 09 | Registro PHP</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: #f1f5f9;
            color: #1e293b;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 24px;
        }

        .container {
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.08), 0 8px 10px -6px rgba(0, 0, 0, 0.04);
            max-width: 480px;
            width: 100%;
            padding: 32px;
            border: 1px solid #e2e8f0;
        }

        .header {
            margin-bottom: 24px;
        }

        .badge {
            display: inline-block;
            background: #ede9fe;
            color: #6d28d9;
            font-size: 12px;
            font-weight: 700;
            padding: 4px 10px;
            border-radius: 9999px;
            text-transform: uppercase;
            margin-bottom: 8px;
        }

        h2 {
            font-size: 22px;
            font-weight: 700;
            color: #0f172a;
        }

        p.subtitle {
            color: #64748b;
            font-size: 14px;
            margin-top: 4px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            color: #334155;
            margin-bottom: 6px;
        }

        input[type="text"],
        input[type="email"] {
            width: 100%;
            padding: 11px 14px;
            border: 1.5px solid #cbd5e1;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
            transition: all 0.2s ease;
        }

        input:focus {
            border-color: #6366f1;
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.15);
        }

        button[type="submit"] {
            width: 100%;
            background: #4f46e5;
            color: #ffffff;
            border: none;
            padding: 12px;
            font-size: 15px;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
            margin-top: 8px;
        }

        button[type="submit"]:hover {
            background: #4338ca;
        }

        button[type="submit"]:active {
            transform: scale(0.99);
        }

        .footer-links {
            margin-top: 20px;
            text-align: center;
            font-size: 13px;
            color: #94a3b8;
        }

        .footer-links a {
            color: #4f46e5;
            text-decoration: none;
            font-weight: 500;
        }

        .footer-links a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <span class="badge">PHP Backend</span>
            <h2>Formulario de Contacto (PHP)</h2>
            <p class="subtitle">Ingrese los datos para registrar el contacto en la sesión del servidor.</p>
        </div>

        <!-- Formulario refactorizado según Guía Práctica 09 -->
        <form action="procesar.php" method="POST">
            <div class="form-group">
                <label for="nombre">Nombre completo:</label>
                <input type="text" id="nombre" name="nombre" placeholder="Ej. Juan Pérez" required minlength="2" maxlength="80">
            </div>

            <div class="form-group">
                <label for="correo">Correo electrónico:</label>
                <input type="email" id="correo" name="correo" placeholder="usuario@correo.com" required>
            </div>

            <button type="submit">Enviar y Registrar</button>
        </form>

        <div class="footer-links">
            <p><a href="procesar.php?ver=tabla">Ver lista de registros actuales</a></p>
        </div>
    </div>

</body>
</html>
